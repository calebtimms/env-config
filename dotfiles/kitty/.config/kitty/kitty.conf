# Note: Example config can be found at /usr/share/doc/kitty/kitty.conf

copy_on_select clipboard
enable_audio_bell no
notify_on_cmd_finish never
confirm_os_window_close 0

# Dark teal highlight
selection_background #24545a
selection_foreground #ffffff

# ============================================================
# Multiplexing
# ============================================================

# Explicit arbitrary horizontal/vertical splits
enabled_layouts splits

# ----- Create splits -----

# Side-by-side
map ctrl+shift+. launch --location=vsplit

# One above the other
map ctrl+shift+, launch --location=hsplit

# ----- Navigate splits -----

map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+j neighboring_window top
map ctrl+shift+k neighboring_window bottom

# ----- Navigate tabs -----
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab

# ----- Resize mode -----

map --new-mode resize ctrl+shift+r

# Reset all splits to default sizes
map --mode resize r resize_window reset

map --mode resize h resize_window narrower
map --mode resize l resize_window wider
map --mode resize j resize_window taller
map --mode resize k resize_window shorter

map --mode resize esc pop_keyboard_mode
map --mode resize enter pop_keyboard_mode

# ============================================================
# Tab Bar
# ============================================================

# Always show the tab bar
tab_bar_min_tabs 1

# Clean separator-based tabs
tab_bar_style separator
tab_separator " │ "
tab_bar_align left
tab_bar_show_new_tab_button no

# Blend the whole tab bar into the terminal background
tab_bar_background #000000

# Active tab
active_tab_foreground #ffffff
active_tab_background #000000
active_tab_font_style bold

# Inactive tabs
inactive_tab_foreground #777777
inactive_tab_background #000000
inactive_tab_font_style normal

# Show keyboard mode prominently
active_tab_title_template "{title}{fmt.bold}{keyboard_mode.upper()}{fmt.nobold}"

# ============================================================
# Scrollback
# ============================================================

scrollback_lines 10000
scrollback_pager_history_size 100

action_alias vim-scrollback launch --type=overlay --stdin-source=@screen_scrollback env KITTY_SCROLLBACK=1 vim -R -c "setlocal buftype=nofile bufhidden=wipe noswapfile nomodifiable" -c "setlocal nomodified" + -

map ctrl+shift+' vim-scrollback

# ============================================================
# Workspaces / Sessions
# ============================================================

# Always start Kitty inside a real default workspace
startup_session sessions/default.kitty-session

# Only show tabs from the active workspace + unassigned tabs
tab_bar_filter session:~

# Save only the current workspace
map ctrl+shift+s>s save_as_session --match=session:. --base-dir ~/.config/kitty/sessions

# Browse and load workspaces
map ctrl+shift+s>l goto_session ~/.config/kitty/sessions

# Jump back to the previous workspace
map ctrl+shift+s>p goto_session -1

# Browse only currently active workspaces
map ctrl+shift+s>a goto_session --active-only

# Close current workspace
map ctrl+shift+s>x close_session .

# New tabs become part of the current workspace
map ctrl+shift+t new_tab_with_cwd
