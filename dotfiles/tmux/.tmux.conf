### Timmseh's tmux setup ###
# The work setup (~/storage/tmux_setup), ported home. Install: bootstrap dotfiles links ~/.tmux.conf here, tmux-project
# is in ~/env-config/scripts (on PATH through ~/.zshrc), and the plugins are cloned by hand:
#          git clone https://github.com/tmux-plugins/tmux-resurrect ~/.tmux/plugins/tmux-resurrect
#          git clone https://github.com/tmux-plugins/tmux-continuum ~/.tmux/plugins/tmux-continuum
# ~/.zshrc starts tmux in every terminal; pacman provides tmux. Keys are pressed after the prefix, Ctrl+A, unless
# marked "no prefix". Home differs from work in its clipboard tools (Wayland) and Kitty passthrough.

## Server and terminal
set -s escape-time 10                    # Esc and Alt+key reach Vim and zsh at once (tmux 3.3 waited 500 ms)
set -s focus-events on                   # terminal Vim's FocusGained (GitGutter's refresh) works inside tmux
set -s default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB,xterm-kitty:RGB'   # 24-bit color in Kitty and VTE terminals
set -g allow-passthrough on              # escapes meant for Kitty reach it, so kitten icat shows images in a pane
# Copies fill both selections: wl-clipboard on Wayland, xclip on X11. Without either, Kitty still gets every copy as
# CLIPBOARD (tmux's OSC 52, set-clipboard), but not PRIMARY, and middle click pastes tmux's own last copy.
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null && command -v wl-paste >/dev/null' {
    set -s copy-command 'f=$(mktemp) && cat > "$f" && wl-copy < "$f" >/dev/null 2>&1 && wl-copy --primary < "$f" >/dev/null 2>&1; rm -f "$f"'
    set -g @paste-primary 'wl-paste --primary --no-newline'
} {
    if-shell 'command -v xclip >/dev/null' {
        set -s copy-command 'xclip -i -selection clipboard -f | xclip -i -selection primary'
        set -g @paste-primary 'xclip -o -selection primary'
    }
}
# Panes run zsh whatever the login shell is (bash at work), set through this server's own binary, whatever tmux is on
# PATH.
run-shell 'z=$(command -v zsh) && /proc/#{pid}/exe set -g default-shell "$z"'

## Behavior
set -g mouse on                          # wheel scrolls history, drag copies; hold Shift for the terminal's own mouse
set -g history-limit 100000              # lines per pane
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off             # ending a session's last window moves to another session
set -g set-titles on
set -g set-titles-string '#{session_name}: #{window_name}'   # the terminal tab's title
set -g display-time 2000
set -g display-panes-time 2000
set -g status-keys emacs                 # the command prompt (prefix :) edits like zsh
setw -g mode-keys vi

## Status bar: [environment] session | windows (red: changed since you left) | PREFIX or copy-mode state, host, time
# The environment is this server's socket name: default, unless tmux -L started another (at work, one per Cheetah
# environment).
set -g status-interval 1                 # also how often windows you are not looking at are checked for changes
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 40
set -g status-left '#[fg=cyan,bold][#{b:socket_path}] #{session_name} #[default]'
set -g status-right '#{?client_prefix,#[bg=colour226#,fg=colour16#,bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=yellow]#{pane_mode} #[default],}#h %H:%M '
# Window flags without * (the current window is magenta) and - (the last window); a changed window is red (below) and
# a zoomed window gets " (zoom)" instead of Z. M (marked pane) stays; !, ~ and # never appear (bells, silence and
# output are not monitored).
setw -g window-status-format '#{?@changed,#[fg=colour196],} #I:#W#{s/[*#Z-]//:window_flags}#{?window_zoomed_flag, (zoom),} '
setw -g window-status-current-format '#[fg=magenta,bold] #I:#W#{s/[*#Z-]//:window_flags}#{?window_zoomed_flag, (zoom),} '
setw -g window-status-current-style default   # no underline (tmux 3.8's default): the magenta marks it
setw -g monitor-bell off                 # programs' terminal bells (BEL) are ignored: no ! flag, beep or flash
# A window's name turns red when its text differs from what it showed when you left it, and goes back when you visit
# it. tmux's own monitor-activity (off) counts any output, such as the redraw an idle Vim makes when its window loses
# focus. Leaving a window (or detaching) fingerprints each pane's visible text; the status line runs the check every
# status-interval, comparing windows no client shows (a resized pane takes a new fingerprint).
setw -g monitor-activity off
set -g @window-changes 'T=/proc/#{pid}/exe; \
    $T list-panes -a -F "##{window_id} ##{pane_id} ##{&&:##{window_active},##{session_attached}}##{?@shown,1,0}##{?@changed,1,0} ##{pane_width}x##{pane_height} ##{@text}" | \
    while read -r w p state size text; do \
        case $state in \
            110) ;; \
            1??) $T set -w -t $w @shown 1 \; set -quw -t $w @changed ;; \
            01?) $T set -p -t $p @text "$size $($T capture-pane -p -t $p | cksum)" \; set -quw -t $w @shown ;; \
            000) now="$size $($T capture-pane -p -t $p | cksum)"; \
                if [ "${text%% *}" != "$size" ]; then $T set -p -t $p @text "$now"; \
                elif [ "$now" != "$text" ]; then $T set -w -t $w @changed 1; fi ;; \
        esac; \
    done; :'
set -ag status-right '#(#{E:@window-changes})'
set-hook -g session-window-changed "run-shell -b '#{E:@window-changes}'"
set-hook -g client-session-changed "run-shell -b '#{E:@window-changes}'"
set-hook -g client-attached "run-shell -b '#{E:@window-changes}'"
set-hook -g client-detached "run-shell -b '#{E:@window-changes}'"
set -g pane-active-border-style 'fg=magenta'
set -g message-style 'bg=colour226,fg=colour16'   # bright yellow: prompts and messages
setw -g mode-style 'bg=colour226,fg=colour16'   # copy-mode selection, prefix s / w tree highlight

## Prefix: Ctrl+A (zsh's line start is Ctrl+H here); pressing it twice sends Ctrl+A to the program.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

## Keys: \ / - split side by side / stacked, h/j/k/l move between panes (j up, k down, as in the vimrc), t new
##       window (not c), n rename window (not ,), [ / ] previous / next window, 0 rightmost window, Tab last window,
##       . move window to a position, < / > move window left / right, q even out panes (not E), P pane numbers
##       (not q), v freeze the pane (copy mode), p paste, g projects, e scrollback in Vim, x kill pane (no y/n),
##       X kill session, r reload this file and ~/.zshrc everywhere, Z reload ~/.zshrc everywhere
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -U
bind k select-pane -D
bind l select-pane -R
unbind E
bind q select-layout -E
bind P display-panes
unbind c
bind t new-window
unbind ,
bind n command-prompt -I '#W' { rename-window "%%" }
bind [ previous-window
bind ] next-window
bind 0 select-window -t ':{end}'
bind Tab last-window
# . slides the window into the typed position (a number past the end means the end, 0 the front) and the others
# shift to make room. < / > swap it with its neighbor, stop at the ends, and repeat without the prefix for half a
# second; tmux's window and pane menus they replace are still on right-click.
bind . command-prompt -p 'Move window to:' {
    if -F '#{m/r:^[0-9]+$,%%}' {
        if -F '#{e|>:%%,#{window_index}}' {
            if -F '#{e|>:%%,#{last_window_index}}' { move-window -a -t ':{end}' } { move-window -a -t ':%%' }
        } {
            if -F '#{e|<:%%,#{window_index}}' {
                if -F '#{e|<:%%,#{base-index}}' { move-window -b -t ':{start}' } { move-window -b -t ':%%' }
            }
        }
    }
}
bind -r < if -F '#{?window_start_flag,,1}' { swap-window -d -t -1 }
bind -r > if -F '#{?window_end_flag,,1}' { swap-window -d -t +1 }
bind v copy-mode
bind p paste-buffer -p
# Popup commands and -w/-h get no #{formats} (run -C expands them first); tmux commands inside a popup act on the pane
# and client it covers.
bind g display-popup -E -w 80% -h 70% -T ' Projects ' tmux-project
# e opens the pane's scrollback in read-only Vim inside the pane, like a man page. A zsh at its prompt runs it (the
# shared zshrc binds this sequence, which no key sends); once it is open the pane is on the alternate screen and e does
# nothing. While a program runs, a borderless popup covers the pane instead.
bind e if -F '#{==:#{pane_current_command},zsh}' {
    if -F '#{pane_in_mode}' { send-keys -X cancel }
    if -F '#{!=:#{alternate_on},1}' { send-keys -l "\e[99~" }
} {
    run -C "display-popup -E -B -x P -y P -w #{pane_width} -h #{pane_height} \
        'tmux capture-pane -p -J -S - | VIM_SCROLLBACK=1 vim -R --not-a-term -'"
}
bind x kill-pane
bind X confirm-before -p 'Kill session #S? (y/n)' kill-session
# r reloads this file and ~/.zshrc everywhere; Z reloads only ~/.zshrc. The zsh reload writes a new stamp beside the
# tmux sockets, then runs sz (source ~/.zshrc) as if typed in every pane of this server whose zsh sits at its prompt
# (leaving copy mode first). Alt+q, zsh's push-line, sets a half-typed line aside until sz is done. Busy shells (and
# those in other servers) run sz themselves when their next prompt starts, through the zshrc's stamp check.
set -g @reload-zsh 'date +%s%N > "#{d:socket_path}/zshrc-reload"; sent=0 left=0; \
    for p in $(tmux list-panes -a -F "##{pane_id}:##{pane_current_command}:##{alternate_on}:##{pane_mode}"); do \
        case $p in \
            *:zsh:0:) ;; \
            *:zsh:0:copy-mode|*:zsh:0:view-mode) tmux send-keys -t "${p%%:*}" -X cancel ;; \
            *) left=$((left + 1)); continue ;; \
        esac; \
        tmux send-keys -t "${p%%:*}" M-q sz Enter; sent=$((sent + 1)); \
    done; \
    tmux display-message "$1~/.zshrc reloaded in $sent idle shell(s); $left busy pane(s) reload at their next prompt"'
bind r source-file ~/.tmux.conf \; run-shell -b 'set -- "Reloaded ~/.tmux.conf; "; #{E:@reload-zsh}'
bind Z run-shell -b '#{E:@reload-zsh}'
# No prefix: middle click pastes the PRIMARY selection, as elsewhere on the desktop, unless the program in the pane
# reads the mouse itself. A pane scrolled back in copy mode returns to its prompt first. Without a clipboard tool
# (@paste-primary, above), it pastes tmux's own last copy, as tmux does by default.
bind -n MouseDown2Pane {
    select-pane -t =
    if -F '#{m/r:^(copy|view)-mode$,#{pane_mode}}' { send -X cancel }
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } {
        if -F '#{@paste-primary}' {
            run -b "#{@paste-primary} 2>/dev/null | tmux load-buffer -b x-primary - && tmux paste-buffer -p -d -b x-primary -t '#{pane_id}'"
        } { paste-buffer -p }
    }
}

## Copy mode is just the pane's scrollback, for the mouse (the wheel enters it; prefix v also freezes a busy pane).
## Any key leaves it and goes on to the program as typed, like a terminal scrolled back, except q, Enter and Esc, which
## only leave. It has no keyboard commands; prefix e searches the scrollback.
# A binding for Any also catches mouse events that copy mode does not bind, which would otherwise fall through to the
# root table (no prefix: middle click, the status bar, borders, menus). So the root bindings are copied in first, and
# Any skips any other mouse event (one with a #{mouse_pane}), as the fall-through did.
unbind -T copy-mode-vi -a
run-shell 'T=/proc/#{pid}/exe; $T list-keys -T root | sed "s/ -T root / -T copy-mode-vi /" | $T source-file -'
bind -T copy-mode-vi Any if -F '#{!:#{mouse_pane}}' { send -X cancel ; send-keys }
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi Enter send -X cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi WheelUpPane select-pane \; send -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 5 scroll-down
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send -X begin-selection
# Dragging, a double-click (a word) or a triple-click (a line) copies to both X selections, then leaves copy mode only
# from the live screen, where leaving moves nothing; scrolled back into the history, the view stays where it is.
bind -T copy-mode-vi MouseDragEnd1Pane if -F '#{scroll_position}' { send -X copy-pipe } { send -X copy-pipe-and-cancel }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; \
    if -F '#{scroll_position}' { send -X copy-pipe } { send -X copy-pipe-and-cancel }
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; \
    if -F '#{scroll_position}' { send -X copy-pipe } { send -X copy-pipe-and-cancel }

## A double-click selects a word, which breaks only at spaces, quotes, brackets and ! $ * ; | ^ \, as in xfce4-terminal,
## so it takes a whole path, URL or e-mail address.
set -g word-separators ' !"$()*;<>[\]^`{|}'
set -ag word-separators "'"

## Sessions survive reboots (tmux-resurrect): every 10 minutes this server's sessions, windows, panes, directories,
## pane contents, and programs such as vim, man, less and tail are saved in ~/.tmux/resurrect/<host>/<server>, and a
## server restores its last save when it starts. prefix Ctrl+S saves now, prefix Ctrl+R restores the last save.
## tmux-continuum's continuum.tmux is not loaded: it turns auto-save and auto-restore off while another tmux server
## runs, and at work there is a server per environment. Its save script (once per @continuum-save-interval minutes) runs from
## status-right instead, and the restore runs below.
set -gF @resurrect-dir "$HOME/.tmux/resurrect/#{host_short}/#{b:socket_path}"
set -g @resurrect-capture-pane-contents on
if-shell 'test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux' {
    run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
    # Server start, not a reload: restore the last save, if any, once the zshrc's first session exists. A run-shell
    # that fails shows its exit status in the first window, so having no save yet must not count as failing.
    if -F '#{!=:#{@resurrect-restored},1}' {
        set -g @resurrect-restored 1
        run-shell -b 'sleep 1; if [ -e "$(tmux show -gqv @resurrect-dir)/last" ]; then ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh; fi'
    }
}
if-shell 'test -f ~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh' {
    # The first save waits an interval after the server starts, so it cannot replace the save being restored.
    if -F '#{==:#{@continuum-save-last-timestamp},}' { set -gF @continuum-save-last-timestamp '#{start_time}' }
    set -g @continuum-save-interval 10
    set -ag status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'
}
